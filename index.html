<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ホルモン軸シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column on phones — axis chips, vertical feedback chain with a vertical "負のフィードバック" rail, then the result card; two columns on wide screens. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#18221F; --muted:#56635F; --line:#C6D0CC;
  --accent:#2C5E52; --accent-soft:#DCE9E4; --hi:#B5412C; --hi-soft:#F6E1DB; --lo:#1F5E9E; --lo-soft:#DCE8F5; --flat:#7C8A86;
  --skin:#E6EDEA; --org:#D6DFDB; --orgline:#B2C0BB; --urine-lo:#EFE3A0; --urine-mid:#D9BC4A; --urine-hi:#A8740A;
  --c0:#13867A; --c1:#C27C0E; --c2:#7048B5; --c3:#C23D6E;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --ink:#E4ECE9; --muted:#9AA9A4; --line:#2E3B37;
  --accent:#86C2AE; --accent-soft:#1F332C; --hi:#F29178; --hi-soft:#3A2420; --lo:#86B8EE; --lo-soft:#1C2A3B; --flat:#8A9894;
  --skin:#1F2926; --org:#2A3632; --orgline:#43534E; --urine-lo:#5B5228; --urine-mid:#A8923A; --urine-hi:#EDC24C; --c0:#4FC9B8; --c1:#E9A93B; --c2:#A88BEA; --c3:#EE7FA4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --ink:#E4ECE9; --muted:#9AA9A4; --line:#2E3B37;
  --accent:#86C2AE; --accent-soft:#1F332C; --hi:#F29178; --hi-soft:#3A2420; --lo:#86B8EE; --lo-soft:#1C2A3B; --flat:#8A9894;
  --skin:#1F2926; --org:#2A3632; --orgline:#43534E; --urine-lo:#5B5228; --urine-mid:#A8923A; --urine-hi:#EDC24C; --c0:#4FC9B8; --c1:#E9A93B; --c2:#A88BEA; --c3:#EE7FA4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
header h1{font-family:var(--f-disp);font-weight:800;font-size:1.65rem;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.02em}
header .sub{color:var(--muted);margin:.3rem 0 1rem;font-size:.9rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:.5rem .4rem;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:.3rem .75rem;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.grid{display:grid;gap:18px}
@media (min-width:880px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}}
.loop{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.chain{position:relative;padding-left:34px}
.rail{position:absolute;left:6px;top:26px;bottom:26px;width:20px;border:2px dashed var(--line);border-right:0;border-radius:10px 0 0 10px}
.rail span{position:absolute;left:-12px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:.7rem;letter-spacing:.2em;color:var(--muted);background:var(--bg);padding:6px 0}
.rail::before{content:"";position:absolute;right:-6px;top:-5px;border:5px solid transparent;border-left-color:var(--line)}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.node[disabled]{cursor:default}
.node.lesion{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.st{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:8px;font-family:var(--f-mono);font-size:1.5rem;font-weight:500}
.st-u{background:var(--hi-soft);color:var(--hi)} .st-d{background:var(--lo-soft);color:var(--lo)} .st-n{background:var(--bg);color:var(--flat)}
.nbody{flex:1;min-width:0;display:flex;flex-direction:column}
.organ{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.hormone{font-weight:700;font-size:1.02rem;line-height:1.35}
.nnote{font-size:.78rem;color:var(--muted);line-height:1.4;margin-top:2px}
.ntag{flex:none;font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.lesion .ntag{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.edge{font-size:.74rem;color:var(--muted);padding:4px 0 4px 56px;display:flex;align-items:center;gap:6px}
.edge b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.menu{display:flex;flex-direction:column;gap:6px;padding:8px 0 4px 20px}
.opt{display:flex;gap:8px;align-items:center;text-align:left;font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:.45rem .7rem;cursor:pointer}
.opt[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.opt .g{font-family:var(--f-mono);width:1.2em}
.g-u{color:var(--hi)} .g-d{color:var(--lo)}
.ext{margin-top:14px}
.ext h3,.sec-h{font-size:.75rem;letter-spacing:.12em;color:var(--muted);margin:0 0 6px;font-weight:700}
.ext .chips{flex-wrap:wrap;overflow:visible}
.reset{margin-top:10px;font:inherit;font-size:.82rem;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;min-width:0}
.lv{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 .45rem}
.result h2{font-family:var(--f-disp);font-weight:800;font-size:1.4rem;line-height:1.35;margin:.4rem 0 .6rem;text-wrap:balance}
.read{background:var(--accent-soft);border-radius:8px;padding:.55rem .75rem;font-weight:500;font-size:.93rem;margin-bottom:12px}
.read .k{display:block;font-size:.7rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.labs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:.1rem .5rem;font-variant-numeric:tabular-nums}
.pill .g{font-family:var(--f-mono);margin-left:4px}
.result dl{margin:0;display:grid;gap:10px}
.result dt{font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.result dd{margin:0}
.result ul{margin:0;padding-left:1.1em}
.result li{margin:.1rem 0}
.pearl{border-left:3px solid var(--hi);padding-left:.7rem}
.jump{margin-top:12px;font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:8px;padding:.35rem .8rem;cursor:pointer}
.empty{color:var(--muted)}
.rule{font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.rule b{color:var(--ink)}
/* body figure */
.figwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:8px}
svg.body{width:100%;height:auto;display:block;max-height:72vh}
.sil{fill:var(--skin);stroke:var(--orgline);stroke-width:1.2}
.org{fill:var(--org);stroke:var(--orgline);stroke-width:1;opacity:.6;transition:fill .5s,stroke .5s,opacity .5s}
.org.on{opacity:1;stroke-width:1.6}
.org.on.s-u{fill:var(--hi-soft);stroke:var(--hi);animation:glow 1.5s ease-in-out infinite}
.org.on.s-d{fill:var(--lo-soft);stroke:var(--lo);stroke-dasharray:3 2}
.org.on.s-n{fill:var(--accent-soft);stroke:var(--accent)}
@keyframes glow{50%{stroke-width:3.4}}
.aorta{fill:none;stroke:var(--orgline);stroke-width:3;opacity:.5}
.trk{fill:none;stroke:var(--orgline);stroke-width:1.3}
.trk.fb{stroke-dasharray:4 4}
.lbl{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--ink)}
.lbl .gu{fill:var(--hi)} .lbl .gd{fill:var(--lo)} .lbl .gn{fill:var(--flat)}
.lead{stroke:var(--orgline);stroke-width:.8}
.fbl{font-size:9.5px;fill:var(--muted);font-family:var(--f-body)}
.lring{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3;transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hit{fill:transparent;cursor:pointer}
.hit:focus-visible{outline:none;stroke:var(--accent);stroke-width:2}
.pill-i{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.tumor-i{fill:var(--hi-soft);stroke:var(--hi);stroke-width:1.4}
.exl{font-size:10px;fill:var(--ink);font-weight:700;font-family:var(--f-body)}
.aorta{transition:stroke-width .5s,stroke .5s,opacity .5s}
.aorta.v-u{stroke:var(--hi);stroke-width:6;opacity:.75}
.aorta.v-d{stroke:var(--lo);stroke-width:1.6;opacity:.8}
.pipe{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .5s,opacity .5s}
.pipe.aux{stroke-dasharray:1 0}
.gutl{fill:none;stroke:var(--orgline);stroke-width:1.1}
.plb{font-family:var(--f-body);font-size:11px;font-weight:700;fill:var(--ink)}
.plb.q{fill:var(--muted);font-weight:500}
.plb .gu{fill:var(--hi)} .plb .gd{fill:var(--lo)}
.vsub{font-size:9px;font-weight:500;fill:var(--muted)} .vsub.on{fill:var(--accent);font-weight:700}
.vt{font-family:var(--f-body);font-size:8.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.vt.q{fill:var(--muted);font-weight:500}
.valve{fill:var(--surface);stroke:var(--flat);stroke-width:1.4}
.valve.o{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.8}
.valve.c{fill:var(--ink);stroke:var(--ink)}
.valve.fx{stroke-dasharray:2 1.6}
.vlock{fill:none;stroke:var(--hi);stroke-width:1.3;stroke-dasharray:2 2}
.L1,.L2,.L3{transition:opacity .45s}
.grid[data-st="1"] .L2,.grid[data-st="1"] .L3,.grid[data-st="2"] .L3{opacity:.08}
.grid[data-st="1"] .labs,.grid[data-st="2"] .labs,.grid[data-st="3"] .labs{opacity:.25}
.grid[data-st="4"] .labs{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.stbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.stbtn{font:inherit;font-weight:700;font-size:.82rem;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:.4rem .9rem;cursor:pointer}
.stdots{display:flex;gap:5px;align-items:center;font-size:.72rem;color:var(--muted)}
.stdots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.stdots i.on{background:var(--accent)}
.stcap{flex-basis:100%;font-size:.84rem;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:.5rem .7rem}
.stcap b{font-family:var(--f-disp)}
.side{font-size:.86rem;line-height:1.65;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:8px;padding:.5rem .7rem;margin:0 0 10px}
.side .k{display:block;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.outs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:.78rem;color:var(--muted)}
.outs .jump{margin:0}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 10px;line-height:1.55}
.gauges{display:flex;flex-direction:column;gap:6px}
.gauge{display:grid;grid-template-columns:10px minmax(0,1fr) 92px 28px;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.gauge[disabled]{cursor:default}
.gauge.lesion{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.gdot{width:10px;height:10px;border-radius:50%}
.gname{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.gname small{font-size:.72rem;color:var(--muted)}
.gname em{font-style:normal;font-size:.72rem;color:var(--muted)}
.meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--lo-soft) 0 33%,var(--bg) 33% 67%,var(--hi-soft) 67% 100%);border:1px solid var(--line)}
.mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--surface);transition:left .9s cubic-bezier(.3,1.4,.5,1)}
.mk.s-u{background:var(--hi)} .mk.s-d{background:var(--lo)} .mk.s-n{background:var(--flat)}
.gst{font-family:var(--f-mono);font-size:1.3rem;text-align:center}
.gst.s-u{color:var(--hi)} .gst.s-d{color:var(--lo)} .gst.s-n{color:var(--flat)}
@media (prefers-reduced-motion:reduce){.org.on.s-u,.lring{animation:none}.mk{transition:none}.pipe,.aorta,.L1,.L2,.L3{transition:none}}
/* tubule */
.neph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.neph svg{width:100%;height:auto;display:block}
.seg{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke:var(--line);stroke-width:11;cursor:pointer;transition:stroke .2s}
.seg.on{stroke:var(--accent)}
.seg:hover{stroke:var(--flat)} .seg.on:hover{stroke:var(--accent)}
.thin{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.svgt{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.svgt.on{fill:var(--accent);font-weight:700}
.zone{stroke:var(--line);stroke-dasharray:3 4}
.glom{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.seginfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.seginfo h2{font-family:var(--f-disp);font-weight:800;font-size:1.25rem;margin:0}
.seginfo .share{font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
.seginfo ul{margin:.3rem 0 .6rem;padding-left:1.1em;font-size:.9rem}
.tlab{width:100%;border-collapse:collapse;font-size:.86rem;margin:4px 0 12px}
.tlab td{border-bottom:1px solid var(--line);padding:.3rem .2rem}
.tlab td:last-child{text-align:right;font-family:var(--f-mono)}
.tv-u{color:var(--hi)} .tv-d{color:var(--lo)} .tv-n,.tv-x{color:var(--flat)} .tv-A{color:var(--lo)} .tv-L{color:var(--hi)}
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:12px}
.cmp{border-collapse:collapse;font-size:.8rem;min-width:640px;width:100%}
.cmp th,.cmp td{padding:.35rem .4rem;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.cmp thead th{font-weight:700;font-size:.74rem}
.cmp td{font-family:var(--f-mono)}
/* quiz */
.qopts{display:grid;gap:8px;margin-top:12px}
.qopt{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;cursor:pointer}
.qopt.ok{border-color:var(--accent);background:var(--accent-soft)}
.qopt.ng{border-color:var(--hi);background:var(--hi-soft)}
.qscore{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.next{margin-top:12px;font:inherit;font-weight:700;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:.5rem 1rem;cursor:pointer}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.fresh .st{animation:pop .42s ease-out both}
@media (prefers-reduced-motion:reduce){.fresh .st{animation:none}}
</style>
<style>:root{color-scheme:light}body{margin:0}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}</style>

<body>
<div class="wrap">
  <header>
    <h1>ホルモン軸シミュレーター</h1>
    <p class="sub">臓器をタップして病変を入れると、上流と下流のホルモンがどう動き、どの病名になるかが出ます。</p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="axis" id="tab-axis">ホルモン軸</button>
      <button role="tab" data-tab="tub" id="tab-tub">尿細管</button>
      <button role="tab" data-tab="quiz" id="tab-quiz">逆引き</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
const AX=[
{id:'hpa',name:'副腎皮質',loop:'コルチゾールがCRH・ACTHを抑制する負のフィードバック。',
 nodes:[{id:'h',organ:'視床下部',hormone:'CRH'},{id:'p',organ:'下垂体前葉',hormone:'ACTH'},{id:'g',organ:'副腎皮質（束状層）',hormone:'コルチゾール'}],
 edges:[['刺激','CRH → ACTH分泌'],['刺激','ACTH → コルチゾール合成']],
 scen:[
 {id:'hpa-adr',at:'g',dir:'u',btn:'腺腫が自律分泌',name:'Cushing症候群（副腎腺腫）',level:'原発性（副腎性）',st:{h:'d',p:'d',g:'u'},labs:[['ACTH','d'],['1mg DST','抑制されない'],['K','d']],
  read:'ACTH↓なのにコルチゾール↑。指令が止まっているのに出続けている＝副腎が勝手に作っている。',

  sx:['満月様顔貌・中心性肥満・野牛肩','赤色皮膚線条・皮膚菲薄化・易出血','高血圧・耐糖能異常・脂質異常','骨粗鬆症・近位筋萎縮','易感染・精神症状'],
  dx:['1mg デキサメタゾン抑制試験（DST）で抑制されない','深夜の血中・唾液コルチゾール高値','血中ACTH低値','副腎CTで腫瘍、アドステロールシンチで患側集積・対側抑制'],
  tx:'腹腔鏡下副腎摘除。術後は対側萎縮のためステロイド補充が必要。',pearl:'ACTHが低いので色素沈着はない。術後の副腎不全を見越して補充する。'},
 {id:'hpa-dis',at:'p',dir:'u',btn:'ACTH産生腺腫',name:'Cushing病',level:'続発性（下垂体性）',st:{h:'d',p:'u',g:'u'},labs:[['ACTH','u'],['8mg DST','抑制される']],
  read:'ACTH↑とコルチゾール↑が同じ向き。指令役から上流が原因。',
  mech:'下垂体腺腫がACTHを過剰分泌する。腺腫はフィードバックに部分的に反応するため、高用量デキサメタゾンでは抑制される。',

function curve(p,q,sign,k){
  const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1;
  const off=sign*(Math.min(46,L*k)+8);
  const cx=(p[0]+q[0])/2-dy/L*off, cy=(p[1]+q[1])/2+dx/L*off;
  const trim=(a,b,t)=>{const vx=b[0]-a[0],vy=b[1]-a[1],l=Math.hypot(vx,vy)||1;return [a[0]+vx/l*t,a[1]+vy/l*t]};
  const s=trim(p,[cx,cy],9), e=trim(q,[cx,cy],11);
  return {d:`M${s[0].toFixed(1)} ${s[1].toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${e[0].toFixed(1)} ${e[1].toFixed(1)}`,mid:[(s[0]+2*cx+e[0])/4,(s[1]+2*cy+e[1])/4]};
}

function flowLayer(a,sc){

  let paths='',valves='',lab='';
  const ucol=`var(--urine-${UC[(sc&&sc.uc)||'n']})`;
  F.pipes.forEach(p=>{
    const s=f[p.id]||'n', col=p.c==='u'?ucol:`var(--c${p.c})`;
    p.col=col;
    paths+=`<path class="pipe${p.aux?' aux':''}" data-edge="f_${p.id}" d="${p.d}" style="stroke:${col};stroke-width:${p.aux?FW[s]*.7:FW[s]};opacity:${s==='n'?.2:.34}"/>`;
    if(p.v){
      const [x,y,tag,side]=p.v, w=vv[p.id], t=(vt&&vt[p.id])||tag, fx=w==='O'||w==='C';

  }

      <span class="gdot" style="background:var(--c${i})"></span>
      <span class="gname"><b>${n.hormone}</b><small>${n.organ}${lesion?'・病変':''}</small>${note?`<em>${note}</em>`:''}</span>
      <span class="meter"><span class="mk s-${s}" data-mk="${key}" data-to="${MK[s]}" style="left:${from}%"></span></span>
      <span class="gst s-${s}">${G[s]}</span></button>`;
    if(!quiz&&S.open===n.id){
      h+=`<div class="menu">`+a.scen.filter(x=>x.at===n.id).map(x=>`<button class="opt" data-scen="${x.id}" aria-pressed="${S.scen===x.id}"><span class="g g-${x.dir}">${G[x.dir]}</span><span>${x.btn} → <b>${x.name}</b></span></button>`).join('')+`</div>`;
    }
    return h;
  }).join('')+`</div>`;
}
function placeP(p){
  const pts=p.e.pts, f=p.t*(pts.length-1), i=Math.min(pts.length-2,Math.floor(f)), r=f-i;
  p.c.setAttribute('cx',(pts[i][0]+(pts[i+1][0]-pts[i][0])*r).toFixed(1));
  p.c.setAttribute('cy',(pts[i][1]+(pts[i+1][1]-pts[i][1])*r).toFixed(1));
  p.c.style.opacity=Math.min(1,p.t*8,(1-p.t)*8).toFixed(2);
}
function spawn(e,t){
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('r',e.r||(e.fb?3.2:4.1));
  if(e.fb){c.style.fill='var(--surface)';c.style.stroke=e.color;c.style.strokeWidth='1.7'}else c.style.fill=e.color;
  (e.fl&&ENG.layer2?ENG.layer2:ENG.layer).appendChild(c);const p={e,t,c};placeP(p);ENG.parts.push(p);
}
function tick(ts){
  if(!ENG.layer||!ENG.layer.isConnected){ENG.raf=0;return}
  const dt=Math.max(0,Math.min(.05,(ts-ENG.last)/1000));ENG.last=ts;
  for(const e of ENG.edges){
    e.rate+=(e.target-e.rate)*Math.min(1,dt*1.6);ENG.rates[e.key]=e.rate;
    e.acc+=e.rate*dt;while(e.acc>=1){e.acc-=1;spawn(e,0)}
  }
  ENG.parts=ENG.parts.filter(p=>{p.t+=dt/p.e.dur;if(p.t>=1){p.c.remove();return false}placeP(p);return true});
  ENG.raf=requestAnimationFrame(tick);
}
function mountBody(){
  $v.querySelectorAll('[data-mk]').forEach(m=>{const to=+m.dataset.to;ENG.marks[m.dataset.mk]=to;requestAnimationFrame(()=>requestAnimationFrame(()=>{m.style.left=to+'%'}))});
  const svg=$v.querySelector('svg.body');ENG.parts=[];ENG.edges=[];
  if(!svg){if(ENG.raf)cancelAnimationFrame(ENG.raf);ENG.raf=0;ENG.layer=null;return}
  ENG.layer=svg.querySelector('.pl');ENG.layer2=svg.querySelector('.pl2');
  ENG.edges=PEND.map(e=>{const p=svg.querySelector(`[data-edge="${e.id}"]`),L=p.getTotalLength(),pts=[];
    for(let i=0;i<=64;i++){const q=p.getPointAtLength(L*i/64);pts.push([q.x,q.y])}
    return {...e,pts,acc:Math.random(),rate:ENG.rates[e.key]??e.target}});
  for(const e of ENG.edges){
    const n=RM.matches?Math.round(e.target*e.dur*.8):Math.round(e.rate*e.dur);
    for(let i=0;i<n;i++)spawn(e,RM.matches?(i+.5)/n:Math.random());
  }
  if(RM.matches)return;
  if(!ENG.raf){ENG.last=performance.now();ENG.raf=requestAnimationFrame(tick)}
}
function labPills(labs){
  if(!labs||!labs.length)return'';
  return `<div class="labs">`+labs.map(([k,v])=>G[v]?`<span class="pill">${k}<span class="g g-${v}">${G[v]}</span></span>`:`<span class="pill">${k}：${v}</span>`).join('')+`</div>`;
}
function resultHTML(sc){
  if(!sc)return `<section class="result"><p class="empty">正常：すべてのホルモンが基準範囲（→）。左の臓器をタップして病変を選んでください。</p></section>`;
  let link='';
  if(sc.link){link=sc.link.seg?`<button class="jump" data-goseg="${sc.link.seg}">尿細管で見る</button>`:`<button class="jump" data-goax="${sc.link.axis}" data-goscen="${sc.link.scen}">${AX.find(a=>a.id===sc.link.axis).name}の軸で見る</button>`}
  return `<section class="result" aria-live="polite"><span class="lv">${sc.level}</span><h2>${sc.name}</h2>
  <div class="read"><span class="k">読み方</span>${sc.read}</div>${labPills(sc.labs)}
  <dl><div><dt>機序</dt><dd>${sc.mech}</dd></div>
  <div><dt>症状・所見</dt><dd><ul>${sc.sx.map(x=>`<li>${x}</li>`).join('')}</ul></dd></div>
  <div><dt>検査</dt><dd><ul>${sc.dx.map(x=>`<li>${x}</li>`).join('')}</ul></dd></div>
  <div><dt>治療</dt><dd>${sc.tx}</dd></div>
  <div><dt>国試ポイント</dt><dd class="pearl">${sc.pearl}</dd></div></dl>${link}</section>`;
}
function axisView(){
  const a=ax(), sc=a.scen.find(s=>s.id===S.scen)||null, ext=a.scen.filter(s=>s.at==='ext');
  const chips=`<div class="chips">`+AX.map(x=>`<button class="chip" data-axis="${x.id}" aria-pressed="${x.id===S.axis}">${x.name}</button>`).join('')+`</div>`;
  const hasF=!!FLOW[a.id], st=hasF&&sc?S.st:0;
  const cap=[null,sc&&`<b>① 原因</b>　${sc.at==='ext'?'':a.nodes.find(n=>n.id===sc.at).organ+'：'}${sc.btn}`,sc&&`<b>② 主軸</b>　${sc.read}`,sc&&sc.sd&&`<b>③ 脇道</b>　${sc.sd}`,'<b>④ 検査値</b>　右のピルが、この変化の結果として測れる値です。'][st];
  const stbar=hasF&&sc?`<div class="stbar"><button class="stbtn" data-stp="1">${st===0?'▶ 順に見る':st<4?'次へ ▶':'全体に戻る'}</button><span class="stdots" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${st>=i?'on':''}"></i>`).join('')}</span>${cap?`<div class="stcap" aria-live="polite">${cap}</div>`:''}</div>`:'';
  const outs=sc&&sc.out?`<div class="outs">つながる先：${sc.out.map(o=>`<button class="jump" data-goax="${o.axis}" data-goscen="${o.scen}">${o.label}</button>`).join('')}</div>`:'';
  const left=`<div><p class="loop">${a.loop}</p>${stbar}<div class="figwrap">${bodySVG(a,sc,false)}</div>
  <p class="hint">粒の多さ＝分泌量。塗りつぶしの粒は下流への指令、白抜きの粒は点線を戻るフィードバック。臓器かメーターをタップすると病変を入れられます。${hasF?'<br>太い帯＝物質の量（細い＝減る、太い＝増える）。丸は弁で、ホルモンの指令を受けて開閉します。「固着」は指令と無関係に動かない状態です。':''}</p>
  ${sc&&sc.sd&&st!==3?`<div class="side"><span class="k">脇道の読み方</span>${sc.sd}</div>`:''}${outs}
  ${gauges(a,sc,false)}
  ${ext.length?`<div class="ext"><h3>外因・異所性・他軸から</h3><div class="chips">${ext.map(s=>`<button class="chip" data-scen="${s.id}" aria-pressed="${S.scen===s.id}">${s.btn}</button>`).join('')}</div></div>`:''}
  <button class="reset" data-reset="1">正常に戻す</button>
  <div class="rule"><b>読み方の原則</b>　指令ホルモンと末梢ホルモンが<b>逆向き</b>なら末梢側が原因（原発性）。<b>同じ向き</b>なら指令側から上流が原因（続発性）。両方とも抑制されているのに作用だけ強いなら、外因か受容体より下流の異常。</div></div>`;
  return chips+`<div class="grid" data-st="${st}">${left}${resultHTML(sc)}</div>`;
}
function nephSVG(){
  const on=id=>S.seg===id||(id==='cd'&&(S.seg==='cdp'||S.seg==='cda'));
  const c=id=>on(id)?' on':'';
  return `<div class="neph"><svg viewBox="0 0 340 270" role="img" aria-label="ネフロンの模式図">
  <line class="zone" x1="0" y1="118" x2="340" y2="118"/><text class="svgt" x="4" y="112">皮質</text><text class="svgt" x="4" y="132">髄質</text>
  <circle class="glom" cx="38" cy="42" r="18"/><text class="svgt" x="20" y="76">糸球体</text>
  <path class="seg${c('pt')}" data-seg="pt" d="M56 42 C78 18 92 64 112 40 S140 22 150 52 L150 100"/>
  <path class="thin" d="M150 104 L150 222 Q160 244 170 222"/>
  <path class="seg${c('tal')}" data-seg="tal" d="M170 218 L170 100"/>
  <path class="seg${c('dct')}" data-seg="dct" d="M170 96 C174 70 200 86 206 60 S232 40 252 52"/>

  <text class="svgt${c('pt')}" x="78" y="74">近位尿細管</text>
  <text class="svgt${c('tal')}" x="178" y="170">上行脚（太）</text>
  <text class="svgt${c('dct')}" x="196" y="96">遠位曲</text>
  <text class="svgt${c('cd')}" x="300" y="150" style="writing-mode:vertical-rl">集合管</text>
  <text class="svgt" x="108" y="240">細い部</text>
  </svg></div>`;
}
function cmpHTML(){
  const rows=SEG.flatMap(s=>s.scen.filter(x=>x.id!=='sglt'&&x.id!=='ndi'&&x.id!=='fan').map(x=>({...x,seg:s.name})));
  return `<div class="cmpwrap"><table class="cmp"><thead><tr><th>病態・薬</th>${TK.map(k=>`<th>${k[1]}</th>`).join('')}</tr></thead><tbody>`+
  rows.map(r=>`<tr><td>${r.name.replace(/（.*?）/,'')}</td>${TK.map(k=>{const t=TV[r.v[k[0]]];return `<td class="tv-${t[1]}">${t[0]}</td>`}).join('')}</tr>`).join('')+`</tbody></table></div>`;
}
function tubView(){
  const seg=SEG.find(s=>s.id===S.seg), sc=seg.scen.find(x=>x.id===S.tscen)||seg.scen[0];
  const chips=`<div class="chips">`+SEG.map(s=>`<button class="chip" data-seg="${s.id}" aria-pressed="${s.id===S.seg}">${s.name}</button>`).join('')+`</div>`;
  const info=`<div class="seginfo"><h2>${seg.name}</h2><div class="share">${seg.share}</div>
   <p class="sec-h" style="margin-top:10px">輸送体</p><ul>${seg.trans.map(t=>`<li>${t}</li>`).join('')}</ul>
   <p class="sec-h">ホルモンの作用点</p><ul>${seg.horm.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  const opts=`<p class="sec-h" style="margin-top:14px">ここを止める・壊す・強めると</p><div class="menu" style="padding-left:0">`+seg.scen.map(x=>`<button class="opt" data-tscen="${x.id}" aria-pressed="${x.id===sc.id}"><span class="g">${x.kind==='薬'?'薬':'病'}</span><span><b>${x.name}</b></span></button>`).join('')+`</div>`;
  let link='';if(sc.link)link=`<button class="jump" data-goax="${sc.link.axis}" data-goscen="${sc.link.scen}">${AX.find(a=>a.id===sc.link.axis).name}の軸で見る</button>`;
  const res=`<section class="result" aria-live="polite"><span class="lv">${seg.name}・${sc.kind==='薬'?'薬剤':'病態'}</span><h2>${sc.name}</h2>
   <table class="tlab"><tbody>${TK.map(k=>{const t=TV[sc.v[k[0]]];return `<tr><td>${k[1]}</td><td class="tv-${t[1]}">${t[0]}</td></tr>`}).join('')}</tbody></table>
   <dl><div><dt>機序</dt><dd>${sc.mech}</dd></div><div><dt>特徴</dt><dd>${sc.note}</dd></div><div><dt>国試ポイント</dt><dd class="pearl">${sc.pearl}</dd></div></dl>${link}</section>`;
  return chips+`<div class="grid"><div>${nephSVG()}${info}${opts}</div><div>${res}
   <button class="jump" data-cmp="1">${S.cmp?'比較表を閉じる':'全体の比較表を開く'}</button>${S.cmp?cmpHTML():''}
   <p class="loop" style="margin-top:10px">「－」はこの表では特記事項なし。代アシ＝代謝性アシドーシス、代アル＝代謝性アルカローシス。</p></div></div>`;
}
function newQ(){
  const all=allScen(), c=all[Math.floor(Math.random()*all.length)];
  const pool=c.ax.scen.filter(s=>s.id!==c.id&&s.name!==c.name);
  const others=all.filter(s=>s.ax.id!==c.ax.id);
  const pick=[];const p=[...pool].sort(()=>Math.random()-.5);
  while(pick.length<3&&p.length)pick.push(p.pop());
  const o=[...others].sort(()=>Math.random()-.5);
  while(pick.length<3)pick.push(o.pop());
  S.q={c,opts:[c,...pick].sort(()=>Math.random()-.5),ans:null};
}
function quizView(){
  if(!S.q)newQ();
  const q=S.q;
  const opts=q.opts.map(o=>{let cl='';if(q.ans){if(o.id===q.c.id)cl=' ok';else if(o.id===q.ans)cl=' ng'}
    return `<button class="qopt${cl}" data-ans="${o.id}" ${q.ans?'disabled':''}>${o.name}</button>`}).join('');
  const after=q.ans?`<div class="read" style="margin-top:12px"><span class="k">${q.ans===q.c.id?'正解':'不正解'}：${q.c.name}</span>${q.c.read}</div>
    <button class="jump" data-goax="${q.c.ax.id}" data-goscen="${q.c.id}">シミュレーターで開く</button> <button class="next" data-next="1">次の問題</button>`:'';
  return `<div class="grid"><div><p class="loop">${q.c.ax.name}の軸。粒の流れと検査から、病態を当ててください。</p><div class="figwrap">${bodySVG(q.c.ax,q.c,true)}</div>${gauges(q.c.ax,q.c,true)}<div style="margin-top:10px">${labPills(q.c.labs)}</div></div>
  <section class="result"><span class="qscore">${S.score[0]} / ${S.score[1]} 正解</span><h2>この動きになる病態は？</h2><div class="qopts">${opts}</div>${after}</section></div>`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $v.innerHTML=S.tab==='axis'?axisView():S.tab==='tub'?tubView():quizView();
  S.fresh=false;save();mountBody();
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.fresh=true;render();window.scrollTo(0,0)});
$v.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.stp){S.st=(S.st+1)%5}
  else if(d.axis){S.axis=d.axis;S.scen=null;S.open=null;S.fresh=true;S.st=0}
  else if(d.node){S.open=S.open===d.node?null:d.node}
  else if(d.scen){S.scen=d.scen;S.fresh=true;S.st=0}
  else if(d.reset){S.scen=null;S.open=null;S.st=0}
  else if(d.seg){S.seg=d.seg;S.tscen=SEG.find(s=>s.id===d.seg).scen[0].id}
  else if(d.tscen){S.tscen=d.tscen}
  else if(d.cmp){S.cmp=!S.cmp}
  else if(d.goseg){S.tab='tub';S.seg=d.goseg;S.tscen=SEG.find(s=>s.id===d.goseg).scen[0].id;window.scrollTo(0,0)}
  else if(d.goax){S.tab='axis';S.axis=d.goax;S.scen=d.goscen;S.st=0;const sc=ax().scen.find(s=>s.id===d.goscen);S.open=sc&&sc.at!=='ext'?sc.at:null;S.fresh=true;window.scrollTo(0,0)}
  else if(d.ans){S.q.ans=d.ans;S.score[1]++;if(d.ans===S.q.c.id)S.score[0]++}
  else if(d.next){newQ()}
  else return;
  render();
});
$v.addEventListener('click',e=>{const p=e.target.closest('path[data-seg]');if(!p)return;S.seg=p.dataset.seg;S.tscen=SEG.find(s=>s.id===S.seg).scen[0].id;render()});
function hitNode(id){S.open=S.open===id?null:id;render();const g=$v.querySelector(`.gauge[data-node="${id}"]`);if(g&&S.open)g.scrollIntoView({block:'nearest',behavior:'smooth'})}
$v.addEventListener('click',e=>{const h=e.target.closest('[data-hit]');if(h)hitNode(h.dataset.hit)});
$v.addEventListener('keydown',e=>{const h=e.target.closest('[data-hit]');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();hitNode(h.dataset.hit)}});
render();
</script>
